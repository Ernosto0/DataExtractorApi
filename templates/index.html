{% extends "base.html" %}

{% block title %}Data Extractor - Extract Information{% endblock %}

{% block content %}
<div class="space-y-8">
    <!-- Extraction Form -->
    <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Test it now</h2>
        
        <form id="extractForm" class="space-y-6">
            <div>
                <label for="text" class="block text-sm font-medium text-gray-700">Text to Extract From</label>
                <textarea name="text" id="text" rows="4" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter the text you want to extract information from..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Fields to Extract</label>
                <div id="fields" class="mt-2 space-y-3">
                    <div class="flex items-center space-x-2">
                        <input type="text" name="fields[]" required
                            class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                            placeholder="Enter field name">
                        <button type="button" onclick="addField()"
                            class="px-3 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                            +
                        </button>
                    </div>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    Extract Data
                </button>
            </div>
        </form>
    </div>

    <!-- Results Section -->
    <div id="results" class="bg-white p-6 rounded-lg shadow-md hidden">
        <h3 class="text-xl font-bold mb-4 text-gray-800">Extracted Data</h3>
        <pre id="resultJson" class="bg-gray-50 p-4 rounded-md overflow-x-auto"></pre>
    </div>
</div>

<script>
    function addField() {
        const fieldsDiv = document.getElementById('fields');
        const newField = document.createElement('div');
        newField.className = 'flex items-center space-x-2';
        newField.innerHTML = `
            <input type="text" name="fields[]" required
                class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                placeholder="Enter field name">
            <button type="button" onclick="this.parentElement.remove()"
                class="px-3 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                ×
            </button>
        `;
        fieldsDiv.appendChild(newField);
    }

    document.getElementById('extractForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const text = document.getElementById('text').value;
        const fields = Array.from(document.getElementsByName('fields[]')).map(input => input.value);
        
        try {
            const response = await fetch('/extract', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    text: text,
                    fields: fields
                })
            });

            const data = await response.json();
            
            // Show results
            document.getElementById('results').classList.remove('hidden');
            document.getElementById('resultJson').textContent = JSON.stringify(data, null, 2);
            
        } catch (error) {
            alert('Error extracting data. Please try again.');
            console.error('Error:', error);
        }
    });
</script>
{% endblock %}
